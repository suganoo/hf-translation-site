name: Weekly Paper Snapshot

on:
  schedule:
    - cron: '0 0 * * 1'   # 毎週月曜 00:00 UTC
  workflow_dispatch:
    inputs:
      weeks:
        description: '過去週の埋め戻し: 対象週の月曜日をスペース区切りで指定 (例: 2026-08-31 2026-09-07)。空なら通常実行'
        required: false
        default: ''
      backfill_explainers:
        description: '既存の全週に解説ページ用データ(概要図・基礎知識)を追加する'
        type: boolean
        default: false
  push:
    branches: [main]      # テンプレート・CSS変更時はサイトの再ビルドのみ

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Generate weekly snapshot
        if: github.event_name != 'push'
        run: |
          if [ "$BACKFILL_EXPLAINERS" = "true" ]; then
            python generate_snapshot.py --backfill-explainers
          elif [ -n "$WEEKS" ]; then
            for w in $WEEKS; do python generate_snapshot.py --week "$w"; done
          else
            python generate_snapshot.py
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WEEKS: ${{ inputs.weeks }}
          BACKFILL_EXPLAINERS: ${{ inputs.backfill_explainers }}

      - name: Commit and push data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "Add weekly snapshot $(date +%F)" || echo "No changes"
          git push

      - run: python build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
